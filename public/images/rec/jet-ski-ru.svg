<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 835" width="600" height="835" role="img" aria-label="Правила для гидроциклов во Флориде. Все на борту — в ненадувных спасжилетах, одобренных Береговой охраной.. Шнур аварийной остановки пристёгнут к водителю.. Нельзя кататься с получаса после заката до получаса до рассвета.. Водителю должно быть не меньше 14 лет.. Флорида, 2025 год: Гидроциклы — 17% зарегистрированных судов, но 23% происшествий.. Правила — ст. 327.39 Законов Флориды. Данные FWC за 2025 год. Покрытие зависит от полиса.">
<title>Правила для гидроциклов во Флориде</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="835" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Правила для гидроциклов во</tspan><tspan x="300" dy="38">Флориде</tspan></text><rect x="24" y="136" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 194.5)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="173" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Все на борту — в ненадувных</tspan><tspan x="114" dy="29">спасжилетах, одобренных</tspan><tspan x="114" dy="29">Береговой охраной.</tspan></text><rect x="24" y="267" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 311)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="304" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Шнур аварийной остановки</tspan><tspan x="114" dy="29">пристёгнут к водителю.</tspan></text><rect x="24" y="369" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 413)"><circle r="26" fill="#07274f"/><circle r="13" fill="none" stroke="#fff" stroke-width="4.5"/><path d="M0 -7 V0 L6 4" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g><text x="114" y="406" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Нельзя кататься с получаса после</tspan><tspan x="114" dy="29">заката до получаса до рассвета.</tspan></text><rect x="24" y="471" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 515)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="508" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Водителю должно быть не меньше</tspan><tspan x="114" dy="29">14 лет.</tspan></text><rect x="24" y="573" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 646)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="610" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Флорида, 2025 год</tspan></text><text x="114" y="639" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Гидроциклы — 17%</tspan><tspan x="114" dy="29">зарегистрированных судов, но 23%</tspan><tspan x="114" dy="29">происшествий.</tspan></text><text x="300" y="755" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Правила — ст. 327.39 Законов Флориды.</tspan><tspan x="300" dy="25">Данные FWC за 2025 год. Покрытие зависит</tspan><tspan x="300" dy="25">от полиса.</tspan></text>
</svg>
