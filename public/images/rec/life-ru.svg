<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 824" width="600" height="824" role="img" aria-label="Сколько понадобится вашей семье?. Годы, на которые семье нужен ваш доход. Ипотека или аренда и долги. Детский сад и колледж. Расходы на похороны. Покрытие и активы, которые уже есть. Дыра: То, что может закрыть страхование жизни. Это оценка, а не рекомендация. Суммы и тип полиса зависят от семьи и от полиса.">
<title>Сколько понадобится вашей семье?</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="824" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Сколько понадобится вашей</tspan><tspan x="300" dy="38">семье?</tspan></text><rect x="24" y="136" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 180)"><circle r="26" fill="#0c5bd6"/><path d="M0 -12 V12 M-12 0 H12" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><text x="114" y="173" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Годы, на которые семье нужен ваш</tspan><tspan x="114" dy="29">доход</tspan></text><rect x="24" y="238" width="552" height="78" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 277)"><circle r="26" fill="#0c5bd6"/><path d="M0 -12 V12 M-12 0 H12" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><text x="114" y="284.5" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Ипотека или аренда и долги</tspan></text><rect x="24" y="330" width="552" height="78" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 369)"><circle r="26" fill="#0c5bd6"/><path d="M0 -12 V12 M-12 0 H12" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><text x="114" y="376.5" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Детский сад и колледж</tspan></text><rect x="24" y="422" width="552" height="78" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 461)"><circle r="26" fill="#0c5bd6"/><path d="M0 -12 V12 M-12 0 H12" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><text x="114" y="468.5" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Расходы на похороны</tspan></text><rect x="24" y="514" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 558)"><circle r="26" fill="#4b5b70"/><path d="M-12 0 H12" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><text x="114" y="551" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Покрытие и активы, которые уже</tspan><tspan x="114" dy="29">есть</tspan></text><rect x="24" y="616" width="552" height="117" rx="16" fill="#fff7e6" stroke="#e0a93b" stroke-width="2"/><g transform="translate(70 674.5)"><circle r="26" fill="#e0a93b"/><path d="M-12 -5 H12 M-12 5 H12" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></g><text x="114" y="653" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Дыра</tspan></text><text x="114" y="682" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">То, что может закрыть</tspan><tspan x="114" dy="29">страхование жизни</tspan></text><text x="300" y="769" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Это оценка, а не рекомендация. Суммы и</tspan><tspan x="300" dy="25">тип полиса зависят от семьи и от полиса.</tspan></text>
</svg>
