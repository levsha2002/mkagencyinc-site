<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 859" width="600" height="859" role="img" aria-label="¿Cuánto necesitaría su familia?. Los años que su familia necesitaría su ingreso. La hipoteca o la renta, y las deudas. El cuidado de los niños y la universidad. Los gastos finales. La cobertura y los bienes que ya tiene. El hueco: Lo que puede llenar un seguro de vida. Es un cálculo aproximado, no una recomendación. Los montos y el tipo de póliza dependen de su familia y de la póliza.">
<title>¿Cuánto necesitaría su familia?</title>
