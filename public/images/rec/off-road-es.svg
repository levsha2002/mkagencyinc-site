<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 882" width="600" height="882" role="img" aria-label="Lo básico del todoterreno en Florida. Título: Obligatorio para vehículos todoterreno comprados por un residente de Florida o usados en terrenos públicos.. Menores de 16: Casco aprobado por el DOT y protección para los ojos en cada salida en ATV.. Vía pública: No, salvo de día en caminos sin pavimentar con límite menor de 35 mph, a menos que el condado decida otra cosa.. Lo que puede ayudar: Responsabilidad civil, pagos médicos y daño físico.. Reglas: ss. 316.2074, 316.2123 y cap. 317, E.F. La cobertura depende de la póliza.">
<title>Lo básico del todoterreno en Florida</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="882" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Lo básico del todoterreno en</tspan><tspan x="300" dy="38">Florida</tspan></text><rect x="24" y="136" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 223.5)"><circle r="26" fill="#07274f"/><rect x="-10" y="-14" width="20" height="28" rx="3" fill="#fff"/><path d="M-5 -5 H5 M-5 2 H5 M-5 9 H2" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="173" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Título</tspan></text><text x="114" y="202" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Obligatorio para vehículos</tspan><tspan x="114" dy="29">todoterreno comprados por un</tspan><tspan x="114" dy="29">residente de Florida o usados en</tspan><tspan x="114" dy="29">terrenos públicos.</tspan></text><rect x="24" y="325" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 398)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="362" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Menores de 16</tspan></text><text x="114" y="391" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Casco aprobado por el DOT y</tspan><tspan x="114" dy="29">protección para los ojos en cada</tspan><tspan x="114" dy="29">salida en ATV.</tspan></text><rect x="24" y="485" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 572.5)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="522" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Vía pública</tspan></text><text x="114" y="551" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">No, salvo de día en caminos sin</tspan><tspan x="114" dy="29">pavimentar con límite menor de 35</tspan><tspan x="114" dy="29">mph, a menos que el condado decida</tspan><tspan x="114" dy="29">otra cosa.</tspan></text><rect x="24" y="674" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 732.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="711" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Lo que puede ayudar</tspan></text><text x="114" y="740" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Responsabilidad civil, pagos médicos</tspan><tspan x="114" dy="29">y daño físico.</tspan></text><text x="300" y="827" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Reglas: ss. 316.2074, 316.2123 y cap. 317,</tspan><tspan x="300" dy="25">E.F. La cobertura depende de la póliza.</tspan></text>
