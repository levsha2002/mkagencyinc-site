<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 855" width="600" height="855" role="img" aria-label="Reglas del jet ski en Florida. Todos a bordo usan chaleco salvavidas no inflable aprobado por la Guardia Costera.. El cordón de apagado va sujeto a quien maneja.. Prohibido navegar desde media hora después de la puesta del sol hasta media hora antes del amanecer.. Quien maneja debe tener al menos 14 años.. Florida, 2025: Las motos acuáticas eran el 17% de las embarcaciones registradas, pero el 23% de los accidentes reportables.. Reglas: s. 327.39, Estatutos de Florida. Datos: FWC, 2025. La cobertura depende de la póliza.">
<title>Reglas del jet ski en Florida</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="855" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Reglas del jet ski en Florida</tspan></text><rect x="24" y="98" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 156.5)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="135" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Todos a bordo usan chaleco</tspan><tspan x="114" dy="29">salvavidas no inflable aprobado por</tspan><tspan x="114" dy="29">la Guardia Costera.</tspan></text><rect x="24" y="229" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 273)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="266" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">El cordón de apagado va sujeto a</tspan><tspan x="114" dy="29">quien maneja.</tspan></text><rect x="24" y="331" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 389.5)"><circle r="26" fill="#07274f"/><circle r="13" fill="none" stroke="#fff" stroke-width="4.5"/><path d="M0 -7 V0 L6 4" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g><text x="114" y="368" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Prohibido navegar desde media hora</tspan><tspan x="114" dy="29">después de la puesta del sol hasta</tspan><tspan x="114" dy="29">media hora antes del amanecer.</tspan></text><rect x="24" y="462" width="552" height="88" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 506)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="499" font-size="22" font-weight="600" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Quien maneja debe tener al menos 14</tspan><tspan x="114" dy="29">años.</tspan></text><rect x="24" y="564" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 651.5)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="601" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Florida, 2025</tspan></text><text x="114" y="630" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Las motos acuáticas eran el 17% de</tspan><tspan x="114" dy="29">las embarcaciones registradas, pero</tspan><tspan x="114" dy="29">el 23% de los accidentes</tspan><tspan x="114" dy="29">reportables.</tspan></text><text x="300" y="775" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Reglas: s. 327.39, Estatutos de Florida.</tspan><tspan x="300" dy="25">Datos: FWC, 2025. La cobertura depende de la</tspan><tspan x="300" dy="25">póliza.</tspan></text>
