<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 853" width="600" height="853" role="img" aria-label="Внедорожная техника во Флориде: основы. Титул: Нужен на технику, купленную жителем Флориды или используемую на государственных землях.. До 16 лет: Шлем по стандарту DOT и защита для глаз в каждой поездке на квадроцикле.. Дороги общего пользования: Нельзя, кроме дневной езды по грунтовым дорогам с ограничением ниже 35 миль/ч, если округ не решил иначе.. Что может помочь: Ответственность, медицинские расходы и ущерб технике.. Правила — ст. 316.2074, 316.2123 и глава 317. Покрытие зависит от полиса.">
<title>Внедорожная техника во Флориде: основы</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="853" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Внедорожная техника во</tspan><tspan x="300" dy="38">Флориде: основы</tspan></text><rect x="24" y="136" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 209)"><circle r="26" fill="#07274f"/><rect x="-10" y="-14" width="20" height="28" rx="3" fill="#fff"/><path d="M-5 -5 H5 M-5 2 H5 M-5 9 H2" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="173" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Титул</tspan></text><text x="114" y="202" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Нужен на технику, купленную</tspan><tspan x="114" dy="29">жителем Флориды или используемую</tspan><tspan x="114" dy="29">на государственных землях.</tspan></text><rect x="24" y="296" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 369)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="333" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">До 16 лет</tspan></text><text x="114" y="362" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Шлем по стандарту DOT и защита</tspan><tspan x="114" dy="29">для глаз в каждой поездке на</tspan><tspan x="114" dy="29">квадроцикле.</tspan></text><rect x="24" y="456" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 543.5)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="493" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Дороги общего пользования</tspan></text><text x="114" y="522" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Нельзя, кроме дневной езды по</tspan><tspan x="114" dy="29">грунтовым дорогам с ограничением</tspan><tspan x="114" dy="29">ниже 35 миль/ч, если округ не</tspan><tspan x="114" dy="29">решил иначе.</tspan></text><rect x="24" y="645" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 703.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="682" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Что может помочь</tspan></text><text x="114" y="711" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Ответственность, медицинские</tspan><tspan x="114" dy="29">расходы и ущерб технике.</tspan></text><text x="300" y="798" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Правила — ст. 316.2074, 316.2123 и глава</tspan><tspan x="300" dy="25">317. Покрытие зависит от полиса.</tspan></text>
</svg>
