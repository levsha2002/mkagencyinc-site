<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" width="600" height="770" role="img" aria-label="Год владельца лодки во Флориде. На воде: Ответственность за травмы и ущерб, причинённые другим.. С 1 июня по 30 ноября: Сезон ураганов. Нужен план: поднять лодку на берег или надёжно закрепить.. После шторма: Владелец обязан убрать разбитую лодку из воды.. Что может помочь: Ответственность, ущерб судну, буксировка и удаление затонувшего судна.. Покрытия и их наличие зависят от полиса.">
<title>Год владельца лодки во Флориде</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="770" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Год владельца лодки во</tspan><tspan x="300" dy="38">Флориде</tspan></text><rect x="24" y="136" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 194.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="173" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">На воде</tspan></text><text x="114" y="202" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Ответственность за травмы и</tspan><tspan x="114" dy="29">ущерб, причинённые другим.</tspan></text><rect x="24" y="267" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 340)"><circle r="26" fill="#4b5b70"/><circle r="5" fill="#fff"/><path d="M0 -14 C 12 -14 15 0 7 5 M0 14 C -12 14 -15 0 -7 -5" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g><text x="114" y="304" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">С 1 июня по 30 ноября</tspan></text><text x="114" y="333" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Сезон ураганов. Нужен план:</tspan><tspan x="114" dy="29">поднять лодку на берег или</tspan><tspan x="114" dy="29">надёжно закрепить.</tspan></text><rect x="24" y="427" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 485.5)"><circle r="26" fill="#07274f"/><rect x="-10" y="-14" width="20" height="28" rx="3" fill="#fff"/><path d="M-5 -5 H5 M-5 2 H5 M-5 9 H2" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="464" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">После шторма</tspan></text><text x="114" y="493" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Владелец обязан убрать разбитую</tspan><tspan x="114" dy="29">лодку из воды.</tspan></text><rect x="24" y="558" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 631)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="595" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Что может помочь</tspan></text><text x="114" y="624" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Ответственность, ущерб судну,</tspan><tspan x="114" dy="29">буксировка и удаление</tspan><tspan x="114" dy="29">затонувшего судна.</tspan></text><text x="300" y="740" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Покрытия и их наличие зависят от полиса.</tspan></text>
</svg>
