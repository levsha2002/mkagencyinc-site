<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 824" width="600" height="824" role="img" aria-label="El autociclo en Florida de un vistazo. Qué es: Dos ruedas adelante y una atrás. Volante, asientos en los que no se va a horcajadas, arcos antivuelco y cinturones.. Licencia: Se necesita licencia de conducir. No se necesita endoso de motocicleta.. PIP: Para la ley de Florida es una motocicleta, así que el PIP del carro no aplica.. Lo que puede ayudar: Pagos médicos, conductor sin seguro y responsabilidad civil.. Reglas: ss. 316.003, 322.03, 627.732, E.F., y FLHSMV. La cobertura depende de la póliza.">
<title>El autociclo en Florida de un vistazo</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="824" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">El autociclo en Florida de un</tspan><tspan x="300" dy="38">vistazo</tspan></text><rect x="24" y="136" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 223.5)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="173" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Qué es</tspan></text><text x="114" y="202" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Dos ruedas adelante y una atrás.</tspan><tspan x="114" dy="29">Volante, asientos en los que no se</tspan><tspan x="114" dy="29">va a horcajadas, arcos antivuelco y</tspan><tspan x="114" dy="29">cinturones.</tspan></text><rect x="24" y="325" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 383.5)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="362" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Licencia</tspan></text><text x="114" y="391" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Se necesita licencia de conducir. No</tspan><tspan x="114" dy="29">se necesita endoso de motocicleta.</tspan></text><rect x="24" y="456" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 529)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="493" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">PIP</tspan></text><text x="114" y="522" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Para la ley de Florida es una</tspan><tspan x="114" dy="29">motocicleta, así que el PIP del</tspan><tspan x="114" dy="29">carro no aplica.</tspan></text><rect x="24" y="616" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 674.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="653" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Lo que puede ayudar</tspan></text><text x="114" y="682" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Pagos médicos, conductor sin seguro</tspan><tspan x="114" dy="29">y responsabilidad civil.</tspan></text><text x="300" y="769" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Reglas: ss. 316.003, 322.03, 627.732, E.F., y</tspan><tspan x="300" dy="25">FLHSMV. La cobertura depende de la póliza.</tspan></text>
