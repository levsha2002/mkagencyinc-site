<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 728" width="600" height="728" role="img" aria-label="Florida autocycle at a glance. What it is: Two wheels in front, one in back. A steering wheel, seats you do not straddle, roll hoops and seat belts.. License: A driver license is required. A motorcycle endorsement is not.. PIP: It is a motorcycle under Florida law, so car PIP does not apply.. What can help: Medical payments, uninsured motorist and liability coverage.. Rules: ss. 316.003, 322.03, 627.732, F.S., and FLHSMV. Coverage depends on the policy.">
<title>Florida autocycle at a glance</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="728" rx="24" fill="#f6f9fe"/>
