/text><text x="114" y="455" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">It is a motorcycle under Florida</tspan><tspan x="114" dy="29">law, so car PIP does not apply.</tspan></text><rect x="24" y="520" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 578.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="557" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">What can help</tspan></text><text x="114" y="586" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Medical payments, uninsured motorist</tspan><tspan x="114" dy="29">and liability coverage.</tspan></text><text x="300" y="673" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Rules: ss. 316.003, 322.03, 627.732, F.S., and</tspan><tspan x="300" dy="25">FLHSMV. Coverage depends on the policy.</tspan></text>
