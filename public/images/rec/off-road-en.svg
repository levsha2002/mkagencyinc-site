<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Florida off-road basics</tspan></text><rect x="24" y="98" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 171)"><circle r="26" fill="#07274f"/><rect x="-10" y="-14" width="20" height="28" rx="3" fill="#fff"/><path d="M-5 -5 H5 M-5 2 H5 M-5 9 H2" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="135" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Title</tspan></text><text x="114" y="164" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Needed for off-highway vehicles</tspan><tspan x="114" dy="29">bought by a Florida resident or used</tspan><tspan x="114" dy="29">on public lands.</tspan></text><rect x="24" y="258" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 316.5)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="295" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Under 16</tspan></text><text x="114" y="324" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">A DOT helmet and eye protection on</tspan><tspan x="114" dy="29">every ATV ride.</tspan></text><rect x="24" y="389" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 462)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="426" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Public roads</tspan></text><text x="11