<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 763" width="600" height="763" role="img" aria-label="A crash with an uninsured driver. What pays a Florida rider’s bills?. Your PIP on the bike: $0: Florida PIP is written for vehicles with four or more wheels.. The other driver: no insurance: About 1 in 5 Florida drivers was uninsured in 2023.. What is left: Medical bills and lost paychecks.. What can help: Medical payments and uninsured motorist coverage on your own policy, up to the limits.. Example situation. What pays depends on your coverages and limits.">
