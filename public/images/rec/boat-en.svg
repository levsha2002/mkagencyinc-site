<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 699" width="600" height="699" role="img" aria-label="A Florida boat owner’s year. On the water: Liability for injuries and damage you cause to others.. June 1 to November 30: Hurricane season. Have a haul-out or tie-down plan.. After a storm: The owner has to remove a wrecked boat from the water.. What can help: Liability, physical damage, towing and wreck removal coverage.. Coverage and availability depend on the policy.">
<title>A Florida boat owner’s year</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="699" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">A Florida boat owner’s year</tspan></text><rect x="24" y="98" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 156.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="135" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">On the water</tspan></text><text x="114" y="164" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Liability for injuries and damage</tspan><tspan x="114" dy="29">you cause to others.</tspan></text><rect x="24" y="229" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 287.5)"><circle r="26" fill="#4b5b70"/><circle r="5" fill="#fff"/><path d="M0 -14 C 12 -14 15 0 7 5 M0 14 C -12 14 -15 0 -7 -5" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g><text x="114" y="266" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">June 1 to November 30</tspan></text><text x="114" y="295" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Hurricane season. Have a haul-out or</tspan><tspan x="114" dy="29">tie-down plan.</tspan></text><rect x="24" y="360" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 418.5)"><circle r="26" fill="#07274f"/><rect x="-10" y="-14" width="20" height="28" rx="3" fill="#fff"/><path d="M-5 -5 H5 M-5 2 H5 M-5 9 H2" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="397" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">After a storm</tspan></text><text x="114" y="426" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">The owner has to remove a wrecked</tspan><tspan x="114" dy="29">boat from the water.</tspan></text><rect x="24" y="491" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 549.5)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="528" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">What can help</tspan></text><text x="114" y="557" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Liability, physical damage, towing</tspan><tspan x="114" dy="29">and wreck removal coverage.</tspan></text><text x="300" y="644" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Coverage and availability depend on the</tspan><tspan x="300" dy="25">policy.</tspan></text>
</svg>
