<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 796" width="600" height="796" role="img" aria-label="¿Carrito de golf o LSV?. Carrito de golf: Hasta 20 mph. Solo por vías designadas por la ciudad o el condado. De la salida a la puesta del sol, salvo autorización. Sin título ni registro.. Vehículo de baja velocidad (LSV): Hasta 25 mph. Calles con límite de 35 mph o menos. Necesita VIN, título, registro, PIP, responsabilidad por daños a la propiedad y licencia.. Lo que puede ayudar: Responsabilidad civil y pagos médicos.. Reglas: ss. 316.212, 316.2122, 320.01, E.F., y FLHSMV. Las reglas locales pueden ser más estrictas.">
<title>¿Carrito de golf o LSV?</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="796" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">¿Carrito de golf o LSV?</tspan></text><rect x="24" y="98" width="552" height="204" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 200)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="135" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Carrito de golf</tspan></text><text x="114" y="164" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Hasta 20 mph. Solo por vías</tspan><tspan x="114" dy="29">designadas por la ciudad o el</tspan><tspan x="114" dy="29">condado. De la salida a la puesta</tspan><tspan x="114" dy="29">del sol, salvo autorización. Sin</tspan><tspan x="114" dy="29">título ni registro.</tspan></text><rect x="24" y="316" width="552" height="233" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 432.5)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="353" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Vehículo de baja velocidad</tspan><tspan x="114" dy="29">(LSV)</tspan></text><text x="114" y="411" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Hasta 25 mph. Calles con límite de</tspan><tspan x="114" dy="29">35 mph o menos. Necesita VIN,</tspan><tspan x="114" dy="29">título, registro, PIP,</tspan><tspan x="114" dy="29">responsabilidad por daños a la</tspan><tspan x="114" dy="29">propiedad y licencia.</tspan></text><rect x="24" y="563" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 621.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="600" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Lo que puede ayudar</tspan></text><text x="114" y="629" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Responsabilidad civil y pagos</tspan><tspan x="114" dy="29">médicos.</tspan></text><text x="300" y="716" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Reglas: ss. 316.212, 316.2122, 320.01, E.F., y</tspan><tspan x="300" dy="25">FLHSMV. Las reglas locales pueden ser más</tspan><tspan x="300" dy="25">estrictas.</tspan></text>
</svg>
