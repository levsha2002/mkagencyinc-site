stroke-width="2.6"/></g><text x="114" y="461" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Lo que queda</tspan></text><text x="114" y="490" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Las facturas médicas y el sueldo</tspan><tspan x="114" dy="29">perdido.</tspan></text><rect x="24" y="555" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 628)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="592" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Lo que puede ayudar</tspan></text><text x="114" y="621" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Los pagos médicos y la cobertura de</tspan><tspan x="114" dy="29">conductor sin seguro de su propia</tspan><tspan x="114" dy="29">póliza, hasta sus límites.</tspan></text><text x="300" y="737" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Situación de ejemplo. Lo que se paga depende</tspan><tspan x="300" dy="25">de sus coberturas y límites.</tspan></text>
