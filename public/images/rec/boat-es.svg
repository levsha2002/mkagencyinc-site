<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 795" width="600" height="795" role="img" aria-label="El año de un dueño de bote en Florida. En el agua: Responsabilidad civil por lesiones y daños que usted cause a otros.. Del 1 de junio al 30 de noviembre: Temporada de huracanes. Tenga un plan para sacarlo del agua o amarrarlo.. Después de la tormenta: El dueño debe sacar del agua un bote destruido.. Lo que puede ayudar: Responsabilidad civil, daño físico, remolque y retiro de restos.. La cobertura y su disponibilidad dependen de la póliza.">
<title>El año de un dueño de bote en Florida</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="795" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">El año de un dueño de bote en</tspan><tspan x="300" dy="38">Florida</tspan></text><rect x="24" y="136" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 194.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="173" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">En el agua</tspan></text><text x="114" y="202" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Responsabilidad civil por lesiones y</tspan><tspan x="114" dy="29">daños que usted cause a otros.</tspan></text><rect x="24" y="267" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 354.5)"><circle r="26" fill="#4b5b70"/><circle r="5" fill="#fff"/><path d="M0 -14 C 12 -14 15 0 7 5 M0 14 C -12 14 -15 0 -7 -5" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g><text x="114" y="304" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Del 1 de junio al 30 de</tspan><tspan x="114" dy="29">noviembre</tspan></text><text x="114" y="362" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Temporada de huracanes. Tenga un</tspan><tspan x="114" dy="29">plan para sacarlo del agua o</tspan><tspan x="114" dy="29">amarrarlo.</tspan></text><rect x="24" y="456" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 514.5)"><circle r="26" fill="#07274f"/><rect x="-10" y="-14" width="20" height="28" rx="3" fill="#fff"/><path d="M-5 -5 H5 M-5 2 H5 M-5 9 H2" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="493" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Después de la tormenta</tspan></text><text x="114" y="522" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">El dueño debe sacar del agua un bote</tspan><tspan x="114" dy="29">destruido.</tspan></text><rect x="24" y="587" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 645.5)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="624" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Lo que puede ayudar</tspan></text><text x="114" y="653" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Responsabilidad civil, daño físico,</tspan><tspan x="114" dy="29">remolque y retiro de restos.</tspan></text><text x="300" y="740" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">La cobertura y su disponibilidad dependen de</tspan><tspan x="300" dy="25">la póliza.</tspan></text>
</svg>
