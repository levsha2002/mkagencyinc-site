<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 767" width="600" height="767" role="img" aria-label="Гольф-кар или LSV?. Гольф-кар: До 20 миль/ч. Только по дорогам, назначенным городом или округом. От восхода до заката, если не разрешено иное. Без титула и регистрации.. Тихоходный автомобиль (LSV): До 25 миль/ч. Улицы с ограничением до 35 миль/ч. Нужны VIN, титул, регистрация, PIP, ответственность за ущерб имуществу и права.. Что может помочь: Ответственность и медицинские расходы.. Правила — ст. 316.212, 316.2122, 320.01 и FLHSMV. Местные правила могут быть строже.">
<title>Гольф-кар или LSV?</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="767" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Гольф-кар или LSV?</tspan></text><rect x="24" y="98" width="552" height="204" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 200)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="135" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Гольф-кар</tspan></text><text x="114" y="164" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">До 20 миль/ч. Только по дорогам,</tspan><tspan x="114" dy="29">назначенным городом или округом.</tspan><tspan x="114" dy="29">От восхода до заката, если не</tspan><tspan x="114" dy="29">разрешено иное. Без титула и</tspan><tspan x="114" dy="29">регистрации.</tspan></text><rect x="24" y="316" width="552" height="204" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 418)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="353" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Тихоходный автомобиль (LSV)</tspan></text><text x="114" y="382" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">До 25 миль/ч. Улицы с</tspan><tspan x="114" dy="29">ограничением до 35 миль/ч. Нужны</tspan><tspan x="114" dy="29">VIN, титул, регистрация, PIP,</tspan><tspan x="114" dy="29">ответственность за ущерб</tspan><tspan x="114" dy="29">имуществу и права.</tspan></text><rect x="24" y="534" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 592.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="571" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Что может помочь</tspan></text><text x="114" y="600" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Ответственность и медицинские</tspan><tspan x="114" dy="29">расходы.</tspan></text><text x="300" y="687" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Правила — ст. 316.212, 316.2122, 320.01 и</tspan><tspan x="300" dy="25">FLHSMV. Местные правила могут быть</tspan><tspan x="300" dy="25">строже.</tspan></text>
</svg>
