<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 786" width="600" height="786" role="img" aria-label="Автоцикл во Флориде коротко. Что это: Два колеса спереди, одно сзади. Руль, сиденья без посадки верхом, дуги безопасности и ремни.. Права: Водительские права нужны. Мотоциклетная отметка — нет.. PIP: По закону Флориды это мотоцикл, поэтому автомобильный PIP не действует.. Что может помочь: Медицинские расходы, покрытие UM и ответственность.. Правила — ст. 316.003, 322.03, 627.732 и FLHSMV. Покрытие зависит от полиса.">
<title>Автоцикл во Флориде коротко</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="786" rx="24" fill="#f6f9fe"/>
<text x="300" y="56" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Автоцикл во Флориде коротко</tspan></text><rect x="24" y="98" width="552" height="175" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 185.5)"><circle r="26" fill="#2f8f5b"/><path d="M-12 1 L-3 10 L13 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="114" y="135" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Что это</tspan></text><text x="114" y="164" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Два колеса спереди, одно сзади.</tspan><tspan x="114" dy="29">Руль, сиденья без посадки</tspan><tspan x="114" dy="29">верхом, дуги безопасности и</tspan><tspan x="114" dy="29">ремни.</tspan></text><rect x="24" y="287" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 345.5)"><circle r="26" fill="#07274f"/><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#fff"/><circle cx="-6" cy="-1" r="4" fill="#07274f"/><path d="M2 -3 H10 M2 3 H8" stroke="#07274f" stroke-width="2.6"/></g><text x="114" y="324" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Права</tspan></text><text x="114" y="353" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Водительские права нужны.</tspan><tspan x="114" dy="29">Мотоциклетная отметка — нет.</tspan></text><rect x="24" y="418" width="552" height="146" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 491)"><circle r="26" fill="#d9534f"/><path d="M0 -13 L0 4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="13" r="3.6" fill="#fff"/></g><text x="114" y="455" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">PIP</tspan></text><text x="114" y="484" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">По закону Флориды это мотоцикл,</tspan><tspan x="114" dy="29">поэтому автомобильный PIP не</tspan><tspan x="114" dy="29">действует.</tspan></text><rect x="24" y="578" width="552" height="117" rx="16" fill="#ffffff" stroke="#d6e0ee" stroke-width="2"/><g transform="translate(70 636.5)"><circle r="26" fill="#0c5bd6"/><path d="M0 -15 L12 -10 L12 0 C12 9 6 14 0 17 C-6 14 -12 9 -12 0 L-12 -10Z" fill="#fff"/></g><text x="114" y="615" font-size="23" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="114" dy="0">Что может помочь</tspan></text><text x="114" y="644" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="start"><tspan x="114" dy="0">Медицинские расходы, покрытие UM</tspan><tspan x="114" dy="29">и ответственность.</tspan></text><text x="300" y="731" font-size="19" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Правила — ст. 316.003, 322.03, 627.732 и</tspan><tspan x="300" dy="25">FLHSMV. Покрытие зависит от полиса.</tspan></text>
</svg>
