<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 767" width="600" height="767" role="img" aria-label="Cómo se suma una póliza paraguas (umbrella)">
<title>Cómo se suma una póliza paraguas (umbrella)</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="767" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Cómo se suma una póliza</tspan><tspan x="300" dy="37">paraguas (umbrella)</tspan></text><text x="300" y="127" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Empieza a pagar cuando se acaba el límite</tspan><tspan x="300" dy="28">de responsabilidad de su auto o casa.</tspan></text><path d="M50 307 Q50 197 300 197 Q550 197 550 307 Q487.5 285 425 307 Q362.5 285 300 307 Q237.5 285 175 307 Q112.5 285 50 307 z" fill="#e0a93b"/><rect x="297" y="179" width="6" height="20" rx="3" fill="#07274f"/><text x="300" y="255" font-size="27" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Umbrella: capa extra</tspan></text><text x="300" y="287" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">por ejemplo $1,000,000</tspan></text><rect x="36" y="327" width="250" height="150" rx="16" fill="#0c5bd6"/><text x="161" y="375" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="161" dy="0">Responsabilidad</tspan><tspan x="161" dy="29">del auto</tspan></text><text x="161" y="443" font-size="22" font-weight="400" fill="#dbe7ff" text-anchor="middle"><tspan x="161" dy="0">ej. $100,000</tspan></text><rect x="314" y="327" width="250" height="150" rx="16" fill="#0c5bd6"/><text x="439" y="375" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="439" dy="0">Responsabilidad</tspan><tspan x="439" dy="29">de la casa</tspan></text><text x="439" y="443" font-size="22" font-weight="400" fill="#dbe7ff" text-anchor="middle"><tspan x="439" dy="0">ej. $300,000</tspan></text><text x="36" y="525" font-size="22" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="36" dy="0">1. Primero paga el seguro de auto o casa.</tspan><tspan x="36" dy="32">2. El umbrella paga el resto, hasta su límite.</tspan></text><rect x="24" y="603" width="552" height="140" rx="18" fill="#07274f"/><text x="300" y="641" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">Lo que ayuda a proteger:</tspan></text><rect x="38" y="663" width="166" height="52" rx="26" fill="#ffffff"/><text x="121" y="697" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="121" dy="0">Ahorros</tspan></text><rect x="217" y="663" width="166" height="52" rx="26" fill="#ffffff"/><text x="300" y="697" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Propiedades</tspan></text><rect x="396" y="663" width="166" height="52" rx="26" fill="#ffffff"/><text x="479" y="697" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="479" dy="0">Su futuro</tspan></text>
</svg>
