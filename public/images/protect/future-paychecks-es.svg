<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" width="600" height="710" role="img" aria-label="Sus sueldos futuros suman mucho">
<title>Sus sueldos futuros suman mucho</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="710" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Sus sueldos futuros suman mucho</tspan></text><text x="300" y="90" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Ejemplo: $50,000 al año por 25 años más</tspan></text><text x="300" y="160" font-size="28" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="300" dy="0">$1,250,000 con los que</tspan><tspan x="300" dy="34">cuenta su familia</tspan></text><rect x="51" y="532" width="82" height="60" rx="8" fill="#5b8def"/><text x="92" y="520" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="92" dy="0">$250K</tspan></text><text x="92" y="622" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="92" dy="0">5 años</tspan></text><rect x="155" y="472" width="82" height="120" rx="8" fill="#5b8def"/><text x="196" y="460" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="196" dy="0">$500K</tspan></text><text x="196" y="622" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="196" dy="0">10 años</tspan></text><rect x="259" y="412" width="82" height="180" rx="8" fill="#5b8def"/><text x="300" y="400" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">$750K</tspan></text><text x="300" y="622" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">15 años</tspan></text><rect x="363" y="352" width="82" height="240" rx="8" fill="#5b8def"/><text x="404" y="340" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="404" dy="0">$1 M</tspan></text><text x="404" y="622" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="404" dy="0">20 años</tspan></text><rect x="467" y="292" width="82" height="300" rx="8" fill="#15803d"/><text x="508" y="280" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="508" dy="0">$1.25 M</tspan></text><text x="508" y="622" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="508" dy="0">25 años</tspan></text><line x1="20" y1="592" x2="580" y2="592" stroke="#07274f" stroke-width="3"/><text x="300" y="676" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">El seguro de vida puede reemplazar una parte o todo.</tspan></text>
</svg>
