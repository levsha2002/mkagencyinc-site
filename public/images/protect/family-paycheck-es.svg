<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" width="600" height="770" role="img" aria-label="Lo que paga un solo sueldo">
<title>Lo que paga un solo sueldo</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="770" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Lo que paga un solo sueldo</tspan></text><text x="300" y="90" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Si se detiene para siempre, las cuentas no.</tspan></text><rect x="150" y="126" width="300" height="78" rx="39" fill="#15803d"/><rect x="176" y="148" width="44" height="34" rx="6" fill="#ffffff"/><circle cx="198" cy="165" r="9" fill="#15803d"/><text x="332" y="174" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="332" dy="0">Un sueldo</tspan></text><path d="M300 204 L110 254" stroke="#b9c9e2" stroke-width="3" stroke-dasharray="6 6"/><path d="M300 204 L300 254" stroke="#b9c9e2" stroke-width="3" stroke-dasharray="6 6"/><path d="M300 204 L490 254" stroke="#b9c9e2" stroke-width="3" stroke-dasharray="6 6"/><rect x="24" y="254" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="110" y="302" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="110" dy="0">Hipoteca</tspan><tspan x="110" dy="30">o renta</tspan></text><rect x="214" y="254" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="300" y="302" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Comida</tspan><tspan x="300" dy="30">y cuentas</tspan></text><rect x="404" y="254" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="490" y="302" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="490" dy="0">Cuidado de</tspan><tspan x="490" dy="30">los niños</tspan></text><rect x="24" y="382" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="110" y="430" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="110" dy="0">Estudios de</tspan><tspan x="110" dy="30">los hijos</tspan></text><rect x="214" y="382" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="300" y="430" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Pago del carro</tspan><tspan x="300" dy="30">y deudas</tspan></text><rect x="404" y="382" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="490" y="430" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="490" dy="0">Gastos</tspan><tspan x="490" dy="30">finales</tspan></text><rect x="24" y="528" width="552" height="104" rx="18" fill="#07274f"/><text x="300" y="572" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">El seguro de vida puede pagarle a su familia</tspan><tspan x="300" dy="30">una suma para que todo siga.</tspan></text><text x="300" y="676" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">El 47% de los adultos en EE. UU. dice que</tspan><tspan x="300" dy="28">tendría problemas para pagar sus cuentas en</tspan><tspan x="300" dy="28">6 meses (LIMRA / Life Happens, 2026).</tspan></text>
</svg>
