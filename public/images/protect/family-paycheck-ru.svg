<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 798" width="600" height="798" role="img" aria-label="Что оплачивает одна зарплата">
<title>Что оплачивает одна зарплата</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="798" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Что оплачивает одна зарплата</tspan></text><text x="300" y="90" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Если она пропадёт навсегда, счета останутся.</tspan></text><rect x="150" y="126" width="300" height="78" rx="39" fill="#15803d"/><rect x="176" y="148" width="44" height="34" rx="6" fill="#ffffff"/><circle cx="198" cy="165" r="9" fill="#15803d"/><text x="332" y="174" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="332" dy="0">Одна зарплата</tspan></text><path d="M300 204 L110 254" stroke="#b9c9e2" stroke-width="3" stroke-dasharray="6 6"/><path d="M300 204 L300 254" stroke="#b9c9e2" stroke-width="3" stroke-dasharray="6 6"/><path d="M300 204 L490 254" stroke="#b9c9e2" stroke-width="3" stroke-dasharray="6 6"/><rect x="24" y="254" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="110" y="302" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="110" dy="0">Ипотека</tspan><tspan x="110" dy="30">или аренда</tspan></text><rect x="214" y="254" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="300" y="302" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Продукты</tspan><tspan x="300" dy="30">и счета</tspan></text><rect x="404" y="254" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="490" y="318" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="490" dy="0">Няня, садик</tspan></text><rect x="24" y="382" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="110" y="430" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="110" dy="0">Учёба</tspan><tspan x="110" dy="30">детей</tspan></text><rect x="214" y="382" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="300" y="430" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Машина</tspan><tspan x="300" dy="30">и долги</tspan></text><rect x="404" y="382" width="172" height="112" rx="16" fill="#ffffff" stroke="#cfdcf0" stroke-width="2"/><text x="490" y="430" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="490" dy="0">Расходы</tspan><tspan x="490" dy="30">на похороны</tspan></text><rect x="24" y="528" width="552" height="104" rx="18" fill="#07274f"/><text x="300" y="572" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">Страхование жизни может выплатить семье</tspan><tspan x="300" dy="30">сумму, чтобы всё это продолжалось.</tspan></text><text x="300" y="676" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">47% взрослых в США говорят, что с трудом</tspan><tspan x="300" dy="28">оплатили бы счета уже через 6 месяцев</tspan><tspan x="300" dy="28">после потери кормильца (LIMRA / Life</tspan><tspan x="300" dy="28">Happens, 2026).</tspan></text>
</svg>
