<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 929" width="600" height="929" role="img" aria-label="When the paycheck stops">
<title>When the paycheck stops</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="929" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">When the paycheck stops</tspan></text><text x="300" y="90" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Example: hurt in a crash, out of work</tspan><tspan x="300" dy="28">for 6 months</tspan></text><line x1="46" y1="172" x2="46" y2="749" stroke="#c9d6ea" stroke-width="6" stroke-linecap="round"/><circle cx="46" cy="172" r="15" fill="#c2410c" stroke="#ffffff" stroke-width="4"/><text x="46" y="179.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="84" y="180" font-size="25" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="84" dy="0">Day 1: the crash</tspan></text><text x="84" y="214" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">You are hurt and cannot work.</tspan><tspan x="84" dy="29">Your paycheck stops.</tspan></text><circle cx="46" cy="310" r="15" fill="#0c5bd6" stroke="#ffffff" stroke-width="4"/><text x="46" y="317.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="84" y="318" font-size="25" font-weight="700" fill="#0c5bd6" text-anchor="start"><tspan x="84" dy="0">First weeks: PIP helps a little</tspan></text><text x="84" y="352" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">PIP pays 60% of lost pay and 80%</tspan><tspan x="84" dy="29">of medical bills, from one shared $10,000.</tspan></text><circle cx="46" cy="448" r="15" fill="#c2410c" stroke="#ffffff" stroke-width="4"/><text x="46" y="455.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="84" y="456" font-size="25" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="84" dy="0">Month 2 or 3: PIP runs out</tspan></text><text x="84" y="490" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Rent, the car payment, groceries and</tspan><tspan x="84" dy="29">the light bill keep coming.</tspan></text><circle cx="46" cy="586" r="15" fill="#4b5b70" stroke="#ffffff" stroke-width="4"/><text x="46" y="593.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">4</tspan></text><text x="84" y="594" font-size="25" font-weight="700" fill="#4b5b70" text-anchor="start"><tspan x="84" dy="0">Month 6: Social Security?</tspan></text><text x="84" y="628" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Only if the injury is expected to last</tspan><tspan x="84" dy="29">a year or more, and after a 5-month wait.</tspan></text><circle cx="46" cy="724" r="15" fill="#e0a93b" stroke="#ffffff" stroke-width="4"/><text x="46" y="731.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">5</tspan></text><rect x="70" y="696" width="512" height="145" rx="14" fill="#fff6e2" stroke="#e0a93b" stroke-width="2"/><text x="84" y="732" font-size="25" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">What can fill the gap</tspan></text><text x="84" y="766" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">If the other driver had no or too little</tspan><tspan x="84" dy="29">insurance, UM can pay lost pay, medical</tspan><tspan x="84" dy="29">bills and pain and suffering, up to your limit.</tspan></text><text x="300" y="895" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Example. Coverage depends on your policy.</tspan></text>
</svg>
