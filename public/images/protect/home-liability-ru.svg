<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 835" width="600" height="835" role="img" aria-label="Обычные случаи дома, которые могут стать иском">
<title>Обычные случаи дома, которые могут стать иском</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="835" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Обычные случаи дома, которые</tspan><tspan x="300" dy="37">могут стать иском</tspan></text><rect x="24" y="137" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><rect x="120" y="175" width="70" height="44" rx="10" fill="#7fb3ff"/><path d="M126 191 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M126 205 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M170 179 v-18 a8 8 0 0 1 16 0" stroke="#07274f" stroke-width="4" fill="none"/><text x="156" y="261" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="156" dy="0">Бассейн</tspan></text><text x="156" y="297" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="156" dy="0">Ребёнок или гость</tspan><tspan x="156" dy="28">пострадал в бассейне</tspan></text><rect x="312" y="137" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><ellipse cx="443" cy="201" rx="18" ry="15" fill="#07274f"/><circle cx="421" cy="183" r="8" fill="#07274f"/><circle cx="435" cy="170" r="8" fill="#07274f"/><circle cx="452" cy="170" r="8" fill="#07274f"/><circle cx="466" cy="183" r="8" fill="#07274f"/><text x="444" y="261" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="444" dy="0">Укус собаки</tspan></text><text x="444" y="297" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="444" dy="0">Ваша собака укусила</tspan><tspan x="444" dy="28">соседа или гостя</tspan></text><rect x="24" y="391" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><path d="M120 473 h18 v-16 h18 v-16 h18 v-16 h16" stroke="#07274f" stroke-width="5" fill="none"/><path d="M160 413 l22 38 h-44 z" fill="#e0a93b"/><rect x="158" y="425" width="5" height="14" fill="#07274f"/><rect x="158" y="442" width="5" height="5" fill="#07274f"/><text x="156" y="515" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="156" dy="0">Гость упал</tspan></text><text x="156" y="551" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="156" dy="0">Мокрая терраса, шаткая</tspan><tspan x="156" dy="28">ступенька, темнота</tspan></text><rect x="312" y="391" width="264" height="230" rx="18" fill="#fff6e2" stroke="#e0a93b" stroke-width="2.5"/><text x="444" y="443" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="444" dy="0">Флорида — 2-е место</tspan><tspan x="444" dy="33">в США по страховым</tspan><tspan x="444" dy="33">случаям с укусами</tspan><tspan x="444" dy="33">собак (2025).</tspan><tspan x="444" dy="33">В среднем $62 375</tspan></text><rect x="24" y="647" width="552" height="164" rx="18" fill="#07274f"/><text x="300" y="691" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">Лимит ответственности по дому часто</tspan><tspan x="300" dy="30">от $100 000 до $300 000. Если иск больше,</tspan><tspan x="300" dy="30">остальное может лечь на вас. Umbrella</tspan><tspan x="300" dy="30">добавляет ещё один слой.</tspan></text>
</svg>
