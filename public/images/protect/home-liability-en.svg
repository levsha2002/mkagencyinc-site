<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 805" width="600" height="805" role="img" aria-label="Everyday accidents at home that can become a claim">
<title>Everyday accidents at home that can become a claim</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="805" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Everyday accidents at home</tspan><tspan x="300" dy="37">that can become a claim</tspan></text><rect x="24" y="137" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><rect x="120" y="175" width="70" height="44" rx="10" fill="#7fb3ff"/><path d="M126 191 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M126 205 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M170 179 v-18 a8 8 0 0 1 16 0" stroke="#07274f" stroke-width="4" fill="none"/><text x="156" y="261" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="156" dy="0">Pool</tspan></text><text x="156" y="297" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="156" dy="0">A child or guest</tspan><tspan x="156" dy="28">is hurt in the pool</tspan></text><rect x="312" y="137" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><ellipse cx="443" cy="201" rx="18" ry="15" fill="#07274f"/><circle cx="421" cy="183" r="8" fill="#07274f"/><circle cx="435" cy="170" r="8" fill="#07274f"/><circle cx="452" cy="170" r="8" fill="#07274f"/><circle cx="466" cy="183" r="8" fill="#07274f"/><text x="444" y="261" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="444" dy="0">Dog bite</tspan></text><text x="444" y="297" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="444" dy="0">Your dog bites a</tspan><tspan x="444" dy="28">neighbor or visitor</tspan></text><rect x="24" y="391" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><path d="M120 473 h18 v-16 h18 v-16 h18 v-16 h16" stroke="#07274f" stroke-width="5" fill="none"/><path d="M160 413 l22 38 h-44 z" fill="#e0a93b"/><rect x="158" y="425" width="5" height="14" fill="#07274f"/><rect x="158" y="442" width="5" height="5" fill="#07274f"/><text x="156" y="515" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="156" dy="0">A guest falls</tspan></text><text x="156" y="551" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="156" dy="0">Wet patio, loose</tspan><tspan x="156" dy="28">step, dark stairs</tspan></text><rect x="312" y="391" width="264" height="230" rx="18" fill="#fff6e2" stroke="#e0a93b" stroke-width="2.5"/><text x="444" y="443" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="444" dy="0">Florida: #2 in the</tspan><tspan x="444" dy="33">U.S. for dog-bite</tspan><tspan x="444" dy="33">claims (2025).</tspan><tspan x="444" dy="33">Average claim:</tspan><tspan x="444" dy="33">$62,375</tspan></text><rect x="24" y="647" width="552" height="134" rx="18" fill="#07274f"/><text x="300" y="691" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">Home liability is often $100,000 to</tspan><tspan x="300" dy="30">$300,000. If a claim is bigger, the rest</tspan><tspan x="300" dy="30">can fall on you. An umbrella adds a layer.</tspan></text>
</svg>
