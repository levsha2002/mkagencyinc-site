<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 767" width="600" height="767" role="img" aria-label="Как зонтичный полис ложится сверху">
<title>Как зонтичный полис ложится сверху</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="767" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Как зонтичный полис</tspan><tspan x="300" dy="37">ложится сверху</tspan></text><text x="300" y="127" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Он начинает платить, когда закончился</tspan><tspan x="300" dy="28">лимит ответственности по авто или дому.</tspan></text><path d="M50 307 Q50 197 300 197 Q550 197 550 307 Q487.5 285 425 307 Q362.5 285 300 307 Q237.5 285 175 307 Q112.5 285 50 307 z" fill="#e0a93b"/><rect x="297" y="179" width="6" height="20" rx="3" fill="#07274f"/><text x="300" y="255" font-size="27" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Umbrella: доп. слой</tspan></text><text x="300" y="287" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">например, $1 000 000</tspan></text><rect x="36" y="327" width="250" height="150" rx="16" fill="#0c5bd6"/><text x="161" y="375" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="161" dy="0">Ответственность</tspan><tspan x="161" dy="29">по авто</tspan></text><text x="161" y="443" font-size="22" font-weight="400" fill="#dbe7ff" text-anchor="middle"><tspan x="161" dy="0">напр. $100 000</tspan></text><rect x="314" y="327" width="250" height="150" rx="16" fill="#0c5bd6"/><text x="439" y="375" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="439" dy="0">Ответственность</tspan><tspan x="439" dy="29">по дому</tspan></text><text x="439" y="443" font-size="22" font-weight="400" fill="#dbe7ff" text-anchor="middle"><tspan x="439" dy="0">напр. $300 000</tspan></text><text x="36" y="525" font-size="22" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="36" dy="0">1. Сначала платит страховка авто или дома.</tspan><tspan x="36" dy="32">2. Остальное — umbrella, в пределах лимита.</tspan></text><rect x="24" y="603" width="552" height="140" rx="18" fill="#07274f"/><text x="300" y="641" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">Что это помогает защитить:</tspan></text><rect x="38" y="663" width="166" height="52" rx="26" fill="#ffffff"/><text x="121" y="697" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="121" dy="0">Сбережения</tspan></text><rect x="217" y="663" width="166" height="52" rx="26" fill="#ffffff"/><text x="300" y="697" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Имущество</tspan></text><rect x="396" y="663" width="166" height="52" rx="26" fill="#ffffff"/><text x="479" y="697" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="479" dy="0">Будущее</tspan></text>
</svg>
