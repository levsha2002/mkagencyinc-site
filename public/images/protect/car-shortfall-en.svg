<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" width="600" height="950" role="img" aria-label="One crash, two very different numbers">
<title>One crash, two very different numbers</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="950" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">One crash, two very</tspan><tspan x="300" dy="37">different numbers</tspan></text><text x="300" y="127" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Example: a driver hit by someone with only</tspan><tspan x="300" dy="28">Florida's minimum insurance can't work for 6 months</tspan></text><defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#fdf3dc"/><line x1="0" y1="0" x2="0" y2="14" stroke="#e0a93b" stroke-width="5" stroke-opacity=".55"/></pattern></defs><rect x="28" y="473.3333333333333" width="262" height="266.6666666666667" fill="#0c5bd6"/><text x="159" y="600.6666666666666" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="159" dy="0">Medical bills</tspan></text><text x="159" y="636.6666666666666" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="159" dy="0">$48,000</tspan></text><rect x="28" y="340" width="262" height="133.33333333333334" fill="#5b8def"/><text x="159" y="374" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="159" dy="0">Lost paychecks</tspan><tspan x="159" dy="26">(6 months)</tspan></text><text x="159" y="448" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="159" dy="0">$24,000</tspan></text><rect x="28" y="248" width="262" height="92" fill="url(#hatch)" stroke="#e0a93b" stroke-width="2"/><rect x="42" y="256" width="234" height="76" rx="10" fill="#fffaf0" fill-opacity=".92"/><text x="159" y="282" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="159" dy="0">Pain and lost</tspan><tspan x="159" dy="26">everyday life</tspan></text><text x="159" y="236" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="159" dy="0">no receipt, still real</tspan></text><rect x="310" y="684.4444444444445" width="262" height="55.55555555555556" fill="#15803d"/><text x="441" y="720.4444444444445" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="441" dy="0">Your PIP: $10,000</tspan></text><rect x="312" y="340" width="258" height="340.44444444444446" rx="6" fill="#fff4ec" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 7"/><text x="441" y="378" font-size="26" font-weight="700" fill="#c2410c" text-anchor="middle"><tspan x="441" dy="0">The gap</tspan></text><text x="441" y="420" font-size="36" font-weight="700" fill="#c2410c" text-anchor="middle"><tspan x="441" dy="0">$62,000</tspan></text><text x="441" y="452" font-size="22" font-weight="400" fill="#c2410c" text-anchor="middle"><tspan x="441" dy="0">+ pain and lost</tspan><tspan x="441" dy="26">everyday life</tspan></text><text x="441" y="518" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="441" dy="0">UM on your own</tspan><tspan x="441" dy="27">policy can help</tspan><tspan x="441" dy="27">pay this, up to</tspan><tspan x="441" dy="27">your limit</tspan></text><text x="441" y="634.4444444444445" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="441" dy="0">Other driver's</tspan><tspan x="441" dy="26">insurance: $0</tspan></text><line x1="16" y1="740" x2="584" y2="740" stroke="#07274f" stroke-width="3"/><text x="159" y="774" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="159" dy="0">What the crash</tspan><tspan x="159" dy="28">really cost</tspan></text><text x="441" y="774" font-size="23" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="441" dy="0">What was paid</tspan></text><text x="300" y="874" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Example numbers. Coverage depends on</tspan><tspan x="300" dy="28">your policy and its limits.</tspan></text>
</svg>
