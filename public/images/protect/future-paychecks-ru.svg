<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 747" width="600" height="747" role="img" aria-label="Сколько стоят ваши будущие зарплаты">
<title>Сколько стоят ваши будущие зарплаты</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="747" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Сколько стоят ваши</tspan><tspan x="300" dy="37">будущие зарплаты</tspan></text><text x="300" y="127" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Пример: $50 000 в год ещё 25 лет</tspan></text><text x="300" y="197" font-size="28" font-weight="700" fill="#15803d" text-anchor="middle"><tspan x="300" dy="0">$1 250 000 — на них</tspan><tspan x="300" dy="34">рассчитывает семья</tspan></text><rect x="51" y="569" width="82" height="60" rx="8" fill="#5b8def"/><text x="92" y="557" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="92" dy="0">$250 тыс.</tspan></text><text x="92" y="659" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="92" dy="0">5 лет</tspan></text><rect x="155" y="509" width="82" height="120" rx="8" fill="#5b8def"/><text x="196" y="497" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="196" dy="0">$500 тыс.</tspan></text><text x="196" y="659" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="196" dy="0">10 лет</tspan></text><rect x="259" y="449" width="82" height="180" rx="8" fill="#5b8def"/><text x="300" y="437" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">$750 тыс.</tspan></text><text x="300" y="659" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">15 лет</tspan></text><rect x="363" y="389" width="82" height="240" rx="8" fill="#5b8def"/><text x="404" y="377" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="404" dy="0">$1 млн</tspan></text><text x="404" y="659" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="404" dy="0">20 лет</tspan></text><rect x="467" y="329" width="82" height="300" rx="8" fill="#15803d"/><text x="508" y="317" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="508" dy="0">$1,25 млн</tspan></text><text x="508" y="659" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="508" dy="0">25 лет</tspan></text><line x1="20" y1="629" x2="580" y2="629" stroke="#07274f" stroke-width="3"/><text x="300" y="713" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Страхование жизни может заменить часть или всё.</tspan></text>
</svg>
