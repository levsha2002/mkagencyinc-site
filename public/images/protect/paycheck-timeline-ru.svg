<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 929" width="600" height="929" role="img" aria-label="Когда зарплата прекращается">
<title>Когда зарплата прекращается</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="929" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Когда зарплата прекращается</tspan></text><text x="300" y="90" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Пример: травма в аварии, полгода</tspan><tspan x="300" dy="28">без работы</tspan></text><line x1="46" y1="172" x2="46" y2="749" stroke="#c9d6ea" stroke-width="6" stroke-linecap="round"/><circle cx="46" cy="172" r="15" fill="#c2410c" stroke="#ffffff" stroke-width="4"/><text x="46" y="179.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="84" y="180" font-size="25" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="84" dy="0">День 1: авария</tspan></text><text x="84" y="214" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Вы травмированы и не можете работать.</tspan><tspan x="84" dy="29">Зарплата перестаёт приходить.</tspan></text><circle cx="46" cy="310" r="15" fill="#0c5bd6" stroke="#ffffff" stroke-width="4"/><text x="46" y="317.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="84" y="318" font-size="25" font-weight="700" fill="#0c5bd6" text-anchor="start"><tspan x="84" dy="0">Первые недели: PIP немного помогает</tspan></text><text x="84" y="352" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">PIP платит 60% потерянного дохода и 80%</tspan><tspan x="84" dy="29">счетов врачей — из одних и тех же $10 000.</tspan></text><circle cx="46" cy="448" r="15" fill="#c2410c" stroke="#ffffff" stroke-width="4"/><text x="46" y="455.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="84" y="456" font-size="25" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="84" dy="0">2–3 месяц: PIP закончился</tspan></text><text x="84" y="490" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Аренда, платёж за машину, продукты</tspan><tspan x="84" dy="29">и свет никуда не делись.</tspan></text><circle cx="46" cy="586" r="15" fill="#4b5b70" stroke="#ffffff" stroke-width="4"/><text x="46" y="593.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">4</tspan></text><text x="84" y="594" font-size="25" font-weight="700" fill="#4b5b70" text-anchor="start"><tspan x="84" dy="0">6 месяц: Social Security?</tspan></text><text x="84" y="628" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Только если травма продлится год или</tspan><tspan x="84" dy="29">дольше, и только после 5 месяцев ожидания.</tspan></text><circle cx="46" cy="724" r="15" fill="#e0a93b" stroke="#ffffff" stroke-width="4"/><text x="46" y="731.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">5</tspan></text><rect x="70" y="696" width="512" height="145" rx="14" fill="#fff6e2" stroke="#e0a93b" stroke-width="2"/><text x="84" y="732" font-size="25" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Что может закрыть дыру</tspan></text><text x="84" y="766" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Если у виновника нет страховки или её</tspan><tspan x="84" dy="29">мало, UM может оплатить потерянный доход,</tspan><tspan x="84" dy="29">лечение, боль и страдания — до лимита.</tspan></text><text x="300" y="895" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Пример. Покрытие зависит от вашего полиса.</tspan></text>
</svg>
