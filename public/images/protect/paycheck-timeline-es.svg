<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 958" width="600" height="958" role="img" aria-label="Cuando el sueldo se detiene">
<title>Cuando el sueldo se detiene</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="958" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Cuando el sueldo se detiene</tspan></text><text x="300" y="90" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Ejemplo: lesionado en un choque, sin</tspan><tspan x="300" dy="28">trabajar durante 6 meses</tspan></text><line x1="46" y1="172" x2="46" y2="778" stroke="#c9d6ea" stroke-width="6" stroke-linecap="round"/><circle cx="46" cy="172" r="15" fill="#c2410c" stroke="#ffffff" stroke-width="4"/><text x="46" y="179.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">1</tspan></text><text x="84" y="180" font-size="25" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="84" dy="0">Día 1: el choque</tspan></text><text x="84" y="214" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Usted se lesiona y no puede trabajar.</tspan><tspan x="84" dy="29">Su sueldo se detiene.</tspan></text><circle cx="46" cy="310" r="15" fill="#0c5bd6" stroke="#ffffff" stroke-width="4"/><text x="46" y="317.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">2</tspan></text><text x="84" y="318" font-size="25" font-weight="700" fill="#0c5bd6" text-anchor="start"><tspan x="84" dy="0">Primeras semanas: el PIP ayuda un poco</tspan></text><text x="84" y="352" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">El PIP paga el 60% del sueldo perdido y el</tspan><tspan x="84" dy="29">80% de los gastos médicos, todo de los</tspan><tspan x="84" dy="29">mismos $10,000.</tspan></text><circle cx="46" cy="477" r="15" fill="#c2410c" stroke="#ffffff" stroke-width="4"/><text x="46" y="484.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">3</tspan></text><text x="84" y="485" font-size="25" font-weight="700" fill="#c2410c" text-anchor="start"><tspan x="84" dy="0">Mes 2 o 3: se acaba el PIP</tspan></text><text x="84" y="519" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">La renta, el pago del carro, la comida</tspan><tspan x="84" dy="29">y la luz siguen llegando.</tspan></text><circle cx="46" cy="615" r="15" fill="#4b5b70" stroke="#ffffff" stroke-width="4"/><text x="46" y="622.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">4</tspan></text><text x="84" y="623" font-size="25" font-weight="700" fill="#4b5b70" text-anchor="start"><tspan x="84" dy="0">Mes 6: ¿Seguro Social?</tspan></text><text x="84" y="657" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Solo si la lesión va a durar un año</tspan><tspan x="84" dy="29">o más, y después de 5 meses de espera.</tspan></text><circle cx="46" cy="753" r="15" fill="#e0a93b" stroke="#ffffff" stroke-width="4"/><text x="46" y="760.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="46" dy="0">5</tspan></text><rect x="70" y="725" width="512" height="145" rx="14" fill="#fff6e2" stroke="#e0a93b" stroke-width="2"/><text x="84" y="761" font-size="25" font-weight="700" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Lo que puede cubrir el hueco</tspan></text><text x="84" y="795" font-size="22" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="84" dy="0">Si el otro conductor no tenía seguro o tenía</tspan><tspan x="84" dy="29">muy poco, el UM puede pagar sueldo perdido,</tspan><tspan x="84" dy="29">gastos médicos y dolor, hasta su límite.</tspan></text><text x="300" y="924" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="300" dy="0">Ejemplo. La cobertura depende de su póliza.</tspan></text>
</svg>
