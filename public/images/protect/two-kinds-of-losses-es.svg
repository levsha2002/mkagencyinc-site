<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 809" width="600" height="809" role="img" aria-label="Dos tipos de pérdidas después de un choque grave">
<title>Dos tipos de pérdidas después de un choque grave</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="809" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Dos tipos de pérdidas</tspan><tspan x="300" dy="37">después de un choque grave</tspan></text><rect x="24" y="137" width="552" height="252" rx="18" fill="#eaf2ff" stroke="#0c5bd6" stroke-width="2.5"/><rect x="24" y="137" width="552" height="58" rx="18" fill="#0c5bd6"/><rect x="24" y="177" width="552" height="18" fill="#0c5bd6"/><text x="48" y="175" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="48" dy="0">Pérdidas con recibo</tspan></text><path d="M524 145 h34 v40 l-6 -5 -5 5 -6 -5 -6 5 -5 -5 -6 5 z" fill="#ffffff"/><rect x="531" y="154" width="20" height="4" fill="#0c5bd6"/><rect x="531" y="163" width="20" height="4" fill="#0c5bd6"/><rect x="531" y="172" width="13" height="4" fill="#0c5bd6"/><circle cx="56" cy="225" r="6" fill="#0c5bd6"/><text x="74" y="233" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Facturas médicas</tspan></text><circle cx="56" cy="257" r="6" fill="#0c5bd6"/><text x="74" y="265" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Sueldo perdido</tspan></text><circle cx="56" cy="289" r="6" fill="#0c5bd6"/><text x="74" y="297" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Lo que usted iba a</tspan></text><text x="74" y="329" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">ganar en el futuro</tspan></text><circle cx="56" cy="353" r="6" fill="#0c5bd6"/><text x="74" y="361" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Ayuda en casa, viajes a terapia</tspan></text><rect x="24" y="413" width="552" height="252" rx="18" fill="#fff8ea" stroke="#b7791f" stroke-width="2.5"/><rect x="24" y="413" width="552" height="58" rx="18" fill="#b7791f"/><rect x="24" y="453" width="552" height="18" fill="#b7791f"/><text x="48" y="451" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="48" dy="0">Pérdidas sin recibo</tspan></text><path d="M541 459 C516 441 526 423 541 433 C556 423 566 441 541 459 z" fill="#ffffff"/><circle cx="56" cy="501" r="6" fill="#b7791f"/><text x="74" y="509" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Dolor que no se va</tspan></text><circle cx="56" cy="533" r="6" fill="#b7791f"/><text x="74" y="541" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Mal sueño, miedo a manejar</tspan></text><circle cx="56" cy="565" r="6" fill="#b7791f"/><text x="74" y="573" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">No poder cargar a sus hijos</tspan></text><circle cx="56" cy="597" r="6" fill="#b7791f"/><text x="74" y="605" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">Perderse deportes, la iglesia,</tspan></text><text x="74" y="637" font-size="24" font-weight="400" fill="#07274f" text-anchor="start"><tspan x="74" dy="0">los viajes en familia</tspan></text><rect x="24" y="689" width="552" height="96" rx="18" fill="#07274f"/><text x="300" y="729" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">El UM puede ayudar a pagar</tspan><tspan x="300" dy="30">los dos tipos, hasta su límite.</tspan></text>
</svg>
