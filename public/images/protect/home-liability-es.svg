<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 835" width="600" height="835" role="img" aria-label="Accidentes comunes en casa que pueden volverse un reclamo">
<title>Accidentes comunes en casa que pueden volverse un reclamo</title>
<style>text{font-family:Arial, Helvetica, 'Segoe UI', Roboto, 'Noto Sans', sans-serif}</style>
<rect width="600" height="835" rx="24" fill="#f6f9fe"/>
<text x="300" y="52" font-size="30" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="300" dy="0">Accidentes comunes en casa</tspan><tspan x="300" dy="37">que pueden volverse un reclamo</tspan></text><rect x="24" y="137" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><rect x="120" y="175" width="70" height="44" rx="10" fill="#7fb3ff"/><path d="M126 191 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M126 205 q8 -8 16 0 t16 0 t16 0 t16 0" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M170 179 v-18 a8 8 0 0 1 16 0" stroke="#07274f" stroke-width="4" fill="none"/><text x="156" y="261" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="156" dy="0">Piscina</tspan></text><text x="156" y="297" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="156" dy="0">Un niño o invitado</tspan><tspan x="156" dy="28">se lesiona</tspan></text><rect x="312" y="137" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><ellipse cx="443" cy="201" rx="18" ry="15" fill="#07274f"/><circle cx="421" cy="183" r="8" fill="#07274f"/><circle cx="435" cy="170" r="8" fill="#07274f"/><circle cx="452" cy="170" r="8" fill="#07274f"/><circle cx="466" cy="183" r="8" fill="#07274f"/><text x="444" y="261" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="444" dy="0">Mordida de perro</tspan></text><text x="444" y="297" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="444" dy="0">Su perro muerde a</tspan><tspan x="444" dy="28">un vecino o visita</tspan></text><rect x="24" y="391" width="264" height="230" rx="18" fill="#ffffff" stroke="#d6e1f1" stroke-width="2"/><path d="M120 473 h18 v-16 h18 v-16 h18 v-16 h16" stroke="#07274f" stroke-width="5" fill="none"/><path d="M160 413 l22 38 h-44 z" fill="#e0a93b"/><rect x="158" y="425" width="5" height="14" fill="#07274f"/><rect x="158" y="442" width="5" height="5" fill="#07274f"/><text x="156" y="515" font-size="25" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="156" dy="0">Una caída</tspan></text><text x="156" y="551" font-size="22" font-weight="400" fill="#4b5b70" text-anchor="middle"><tspan x="156" dy="0">Patio mojado, escalón</tspan><tspan x="156" dy="28">flojo, poca luz</tspan></text><rect x="312" y="391" width="264" height="230" rx="18" fill="#fff6e2" stroke="#e0a93b" stroke-width="2.5"/><text x="444" y="443" font-size="22" font-weight="700" fill="#07274f" text-anchor="middle"><tspan x="444" dy="0">Florida: #2 en</tspan><tspan x="444" dy="33">EE. UU. en reclamos</tspan><tspan x="444" dy="33">por mordidas de</tspan><tspan x="444" dy="33">perro (2025).</tspan><tspan x="444" dy="33">Promedio: $62,375</tspan></text><rect x="24" y="647" width="552" height="164" rx="18" fill="#07274f"/><text x="300" y="691" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="300" dy="0">La responsabilidad de casa suele ser de</tspan><tspan x="300" dy="30">$100,000 a $300,000. Si el reclamo es mayor,</tspan><tspan x="300" dy="30">el resto puede caer en usted. El umbrella</tspan><tspan x="300" dy="30">agrega una capa más.</tspan></text>
</svg>
